name: Browser devtools

on:
  pull_request:
    paths:
      - .github/workflows/devtools.yml
      - extensions/**
      - lib/**
      - package-lock.json
      - package.json
      - tasks/build-devtools.js
      - tasks/lint-firefox-devtools.js
      - tasks/package-devtools.js
      - tasks/publish-chrome-devtools.js
  push:
    branches:
      - master
    paths:
      - .github/workflows/devtools.yml
      - extensions/**
      - lib/**
      - package-lock.json
      - package.json
      - tasks/build-devtools.js
      - tasks/lint-firefox-devtools.js
      - tasks/package-devtools.js
      - tasks/publish-chrome-devtools.js

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run devtools:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: figbird-devtools-unsigned
          path: |
            extensions/build/figbird-devtools-chrome.zip
            extensions/build/figbird-devtools-firefox-unsigned.zip
            extensions/build/figbird-devtools-source.zip
