name: Release browser devtools

on:
  push:
    branches:
      - master
    paths:
      - extensions/version.json
  workflow_dispatch:
    inputs:
      upload_chrome:
        description: Upload the Chrome ZIP without submitting it for review
        type: boolean
        default: false
      submit_chrome:
        description: Upload and submit the private Chrome item for review
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: devtools-release

jobs:
  build:
    name: Build release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 26
      - run: npm ci
      - run: npm run devtools:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: figbird-devtools-release-inputs
          path: |
            extensions/build/figbird-devtools-chrome.zip
            extensions/build/figbird-devtools-firefox-unsigned.zip
            extensions/build/figbird-devtools-source.zip
      - name: Publish the Chrome extension archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./extensions/version.json').version")
          tag="devtools-v${version}"
          asset=extensions/build/figbird-devtools-chrome.zip

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Figbird Devtools ${version}" \
              --notes "Browser extension builds for developer distribution. Load the Chrome ZIP unpacked in developer mode, or install the Mozilla-signed Firefox XPI."
          fi

  chrome:
    name: Upload and publish Chrome
    if: github.event_name == 'push' || inputs.upload_chrome || inputs.submit_chrome
    needs: build
    environment: extension-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: figbird-devtools-release-inputs
          path: extensions/build
      - id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT }}
          token_format: access_token
          workload_identity_provider: ${{ vars.CHROME_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Upload the Chrome extension
        env:
          CHROME_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_EXTENSION_ARCHIVE: extensions/build/figbird-devtools-chrome.zip
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SUBMIT: ${{ github.event_name == 'push' || inputs.submit_chrome }}
        run: node tasks/publish-chrome-devtools.js
