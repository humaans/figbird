name: Stage npm release

on:
  push:
    branches:
      - master
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: stage-npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          previous=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          current=$(node -p "require('./package.json').version")
          if [ "$previous" = "$current" ]; then
            echo 'No package version change; skipping npm staging.'
            exit 0
          fi
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
            const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
            assert.equal(lock.version, manifest.version, 'lockfile version must match');
            assert.equal(lock.packages[''].version, manifest.version, 'lockfile root version must match');
          "
          echo "release=true" >> "$GITHUB_OUTPUT"
          tag=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test and build package
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci
          npm test
          npm run package:check
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.release == 'true'
        with:
          name: figbird-npm-release
          path: ${{ runner.temp }}/npm-release/figbird-*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: figbird-npm-release
          path: npm-release
      - name: Stage for maintainer approval
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: npm stage publish ./npm-release/figbird-*.tgz --tag="$TAG" --ignore-scripts
